<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayıt Ol - 66 Vizite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }
    .auth-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-header .brand-logo {
      justify-content: center;
      margin-bottom: 16px;
    }
    .auth-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .auth-header p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    .auth-form-card {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 24px;
      color: var(--text-muted);
      font-size: 0.9rem;
      transition: var(--transition);
      text-decoration: none;
    }
    .back-home:hover {
      color: var(--accent-yellow);
    }
  </style>
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-logo">
          <svg class="brand-icon" viewBox="0 0 36 36" fill="none">
            <path d="M7 26C11 18 25 18 29 26" stroke="#F5A623" stroke-width="4" stroke-linecap="round" />
            <path d="M12 18C15 13 21 13 24 18" stroke="#F5A623" stroke-width="3" stroke-linecap="round" />
            <circle cx="9" cy="27" r="3" fill="#F5A623" />
            <circle cx="27" cy="27" r="3" fill="#F5A623" />
          </svg>
          <span class="brand-name">66 Vizite</span>
        </a>
        <h1>Hesap Oluştur</h1>
        <p>Pro pakete başlamak ve aracınızı eklemek için kaydolun.</p>
      </div>

      <!-- Temel Kayıt Formu -->
      <form id="pageRegisterForm" class="auth-form-card" novalidate>
        <div class="form-group">
          <label for="name">Ad Soyad</label>
          <input type="text" id="name" name="fullName" placeholder="Adınız Soyadınız" required>
        </div>

        <div class="form-group">
          <label for="email">E-posta Adresi</label>
          <input type="email" id="email" name="email" placeholder="ornek@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">Şifre</label>
          <input type="password" id="password" name="password" placeholder="En az 6 karakter" required>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-full">Kayıt Ol ve Panele Geç</button>
      </form>

      <div style="text-align: center; margin-top: 20px;">
        <a href="index.html" class="back-home">← Ana Sayfaya Dön</a>
      </div>
    </div>
  </div>

  <script src="toast.js"></script>
  <script>
    const regForm = document.getElementById('pageRegisterForm');
    const submitBtn = document.getElementById('submitBtn');

    regForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      const nameInput = document.getElementById('name');
      const emailInput = document.getElementById('email');
      const passInput = document.getElementById('password');

      const fullName = nameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passInput.value;

      // Temizle
      [nameInput, emailInput, passInput].forEach(inp => inp.classList.remove('input-invalid'));

      if (!fullName) {
        nameInput.classList.add('input-invalid');
        nameInput.focus();
        toast.warning('Lütfen Ad Soyad alanını doldurunuz.');
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        emailInput.classList.add('input-invalid');
        emailInput.focus();
        toast.warning('Lütfen geçerli bir e-posta adresi giriniz.');
        return;
      }

      if (!password || password.length < 6) {
        passInput.classList.add('input-invalid');
        passInput.focus();
        toast.warning('Şifreniz en az 6 karakter olmalıdır.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Kayıt Yapılıyor...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ fullName, email, password, planTier: 'pro' })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          if (data.user) {
            localStorage.setItem('currentUser', JSON.stringify(data.user));
          }
          toast.success('Hesabınız başarıyla oluşturuldu! Panelinize yönlendiriliyorsunuz.', 'Hoş Geldiniz');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1200);
        } else {
          toast.error(data.message || 'Kayıt işlemi başarısız.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Kayıt Ol ve Panele Geç';
        }
      } catch (err) {
        toast.error('Sunucu ile iletişim kurulamadı. Lütfen sunucunun açık olduğundan emin olun.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Kayıt Ol ve Panele Geç';
      }
    });
  </script>
</body>
</html>
